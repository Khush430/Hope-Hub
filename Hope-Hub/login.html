<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Log in to your Yajna for Humanity account to manage your donations and profile.">
  <title>Log in — Yajna for Humanity</title>
  <link rel="icon" href="images/bird_2.jpg">

  <!-- Web fonts + icons + shared stylesheet -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <!-- ============================== HEADER ============================== -->
  <header class="site-header">
    <nav class="navbar container" aria-label="Main navigation">
      <a href="index.html" class="brand">
        <img src="images/bird_2.jpg" alt="Yajna for Humanity logo" class="brand__logo">
        <span>Yajna <em>for Humanity</em></span>
      </a>

      <button class="nav-toggle" aria-expanded="false" aria-controls="primary-nav" aria-label="Open menu">
        <span></span><span></span><span></span>
      </button>

      <ul class="nav-links" id="primary-nav">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="blog.html">Blog</a></li>
        <li><a href="donate.html">Causes</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li><a href="login.html" aria-current="page">Log in</a></li>
        <li><a href="form.html" class="btn btn--primary btn--sm">Donate now</a></li>
      </ul>
    </nav>
  </header>

  <!-- ========================= LOG-IN CARD =========================
       Centred card on a brand-coloured gradient background. -->
  <main class="auth">
    <div class="auth-card">
      <h1>Welcome back</h1>
      <p>Log in to manage your donations and profile.</p>

      <form action="#" method="POST" class="form-grid">
        <div class="field">
          <label for="login-email">Email address <span class="required">*</span></label>
          <input type="email" id="login-email" name="email" placeholder="you@example.com" required autocomplete="email">
        </div>

        <div class="field">
          <label for="login-password">Password <span class="required">*</span></label>
          <input type="password" id="login-password" name="password" placeholder="Your password" required autocomplete="current-password">
        </div>

        <!-- Remember me + forgotten password on one row -->
        <div style="display:flex; justify-content:space-between; align-items:center; font-size:0.88rem;">
          <label style="display:flex; gap:0.45rem; align-items:center; font-weight:400; font-family:var(--font-body); margin:0;">
            <input type="checkbox" name="remember" style="width:auto;"> Remember me
          </label>
          <a href="#">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn--primary">Log in</button>
      </form>

      <div class="divider">or continue with</div>

      <div class="social-auth">
        <button type="button"><i class="fa-brands fa-google" aria-hidden="true"></i> Google</button>
        <button type="button"><i class="fa-brands fa-facebook-f" aria-hidden="true"></i> Facebook</button>
      </div>

      <p class="swap">Don't have an account? <a href="signup.html">Sign up</a></p>
    </div>
  </main>

  <script src="js/main.js"></script>
</body>
</html>
